
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employee records easily</p>
    </header>

    <main class="container">

        <section class="form-card">
            <h2 id="formTitle">Add Employee</h2>

            <form id="employeeForm">
                <input type="hidden" id="employeeId">

                <label for="name">Employee Name</label>
                <input type="text" id="name" placeholder="Enter employee name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address" required>

                <label for="department">Department</label>
                <input type="text" id="department" placeholder="Enter department" required>

                <label for="role">Role</label>
                <input type="text" id="role" placeholder="Enter employee role" required>

                <label for="joining_date">Joining Date</label>
                <input type="date" id="joining_date">

                <label for="salary">Salary</label>
                <input type="number" id="salary" placeholder="Enter salary" min="0" step="0.01" required>

                <button type="submit" id="submitButton">Add Employee</button>
                <button type="button" id="cancelButton" hidden>Cancel Edit</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="table-card">
            <h2>Employee Records</h2>
            <input
    type="text"
    id="searchInput"
    placeholder="Search by name, email, department or role..."
>
<select id="sortBy">
    <option value="">Default Order</option>
    <option value="name">Name (A–Z)</option>
    <option value="department">Department (A–Z)</option>
    <option value="salary">Salary (Low to High)</option>
</select>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Role</th>
                            <th>Joining Date</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTableBody">
                        <tr>
                            <td colspan="6">Loading employees...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
